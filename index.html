<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Flugbuch</title>

<meta name="theme-color" content="#040e20" />

<style>
  html, body {
    margin: 0; padding: 0; background: #040e20;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, sans-serif;
    color: #e8f4fd;
    min-height: 100vh;
  }
  * { box-sizing: border-box; }

  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(232,244,253,0.4);
    margin-bottom: 6px;
  }

  h1 {
    font-size: 30px;
    font-weight: 800;
    margin: 0 0 40px;
    text-align: center;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 380px;
  }

  a.card {
    display: flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: inherit;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  a.card:active { transform: scale(0.98); background: rgba(255,255,255,0.07); }

  .card .icon {
    font-size: 30px;
    flex-shrink: 0;
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card.flugbuch .icon { background: rgba(125,211,252,0.15); }
  .card.statistik .icon { background: rgba(74,222,128,0.15); }
  .card.material .icon { background: rgba(250,204,21,0.15); }
  .card.service .icon { background: rgba(248,113,113,0.15); }

  .card .text { flex: 1; min-width: 0; }
  .card .title { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
  .card .desc { font-size: 12px; color: rgba(232,244,253,0.5); }
  .card .arrow { font-size: 18px; color: rgba(232,244,253,0.3); flex-shrink: 0; }

  .card .icon { position: relative; }
  .dirty-dot {
    position: absolute;
    top: -3px; right: -3px;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #f87171;
    border: 2px solid #040e20;
    display: none;
  }
  .dirty-dot.show { display: block; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Willkommen zurück</div>
    <h1>🪂 Flugbuch</h1>
    <div class="cards">
      <a class="card flugbuch" href="flugbuch.html">
        <div class="icon">📖</div>
        <div class="text">
          <div class="title">Flugbuch</div>
          <div class="desc">Alle Flüge, IGC-Import, Karten & Höhenprofile</div>
        </div>
        <div class="arrow">›</div>
      </a>
      <a class="card statistik" href="statistik.html">
        <div class="icon">📊</div>
        <div class="text">
          <div class="title">Statistik</div>
          <div class="desc">Jahres-Übersicht mit Filtern nach Typ, Reise, Schirm …</div>
        </div>
        <div class="arrow">›</div>
      </a>
      <a class="card material" href="material.html">
        <div class="icon">🎒</div>
        <div class="text">
          <div class="title">Material</div>
          <div class="desc">Schirme, Rettungsgeräte & Ausrüstung im Überblick</div>
        </div>
        <div class="arrow">›</div>
      </a>
      <a class="card service" href="service.html">
        <div class="icon">🛠️<span id="serviceDirtyDot" class="dirty-dot"></span></div>
        <div class="text">
          <div class="title">Service</div>
          <div class="desc">Backup & Restore für Flugbuch, Statistik und Material</div>
        </div>
        <div class="arrow">›</div>
      </a>
    </div>
  </div>

  <script>
    // Identischer Storage-Zugriff (nur lesend) wie in flugbuch.html/
    // service.html/etc. — zeigt einen roten Punkt auf der Service-Karte,
    // sobald irgendeine Seite seit dem letzten Backup Daten geändert hat
    // (settings:backupDirty, zentral von allen Seiten gemeinsam gepflegt).
    (function () {
      const DB_NAME = "flugbuch-db";
      const STORE = "kv";
      const PREFIX = "flugbuch:";
      function openDb() {
        return new Promise((resolve, reject) => {
          if (!window.indexedDB) { reject(new Error("IndexedDB not available")); return; }
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = () => { req.result.createObjectStore(STORE); };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
      async function getFlag() {
        try {
          const db = await openDb();
          return await new Promise((resolve, reject) => {
            const tx = db.transaction(STORE, "readonly");
            const req = tx.objectStore(STORE).get(PREFIX + "settings:backupDirty");
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
          });
        } catch { return null; }
      }
      getFlag().then(value => {
        if (value === "1") {
          const dot = document.getElementById("serviceDirtyDot");
          if (dot) dot.classList.add("show");
        }
      });
    })();
  </script>
</body>
</html>

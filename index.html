<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Flugbuch</title>

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Flugbuch" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120.png" />
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png" />
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png" />
<meta name="theme-color" content="#040e20" />

<style>
  html, body { margin:0; padding:0; background:#040e20; -webkit-tap-highlight-color: transparent; }
  #root { min-height: 100vh; }
  * { -webkit-touch-callout: none; }
  input, textarea, button { -webkit-user-select: text; user-select: text; }
  #load-status { color:#fcd34d; font-family:monospace; font-size:11px; padding:14px; white-space:pre-wrap; }
  /* MapTiler/MapLibre marker popup text was rendering low-contrast (light
     grey on white) — make it clearly legible. */
  .maplibregl-popup-content { color:#111827; font-weight:600; }
</style>

<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
<!-- Latitude/longitude -> IANA timezone lookup, used to convert IGC B-record
     times (always UTC per the IGC spec) to correct local time when the file
     doesn't carry its own HFTZN timezone header. Exposes a global
     `tzlookup(lat, lon)` function. -->
<script src="https://cdn.jsdelivr.net/npm/tz-lookup@6.1.25/tz.js"></script>
<!-- SheetJS: reads the one-time Excel import (Flugbuch.xlsx, Reiter "Flüge")
     directly in the browser, no server round-trip needed. -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.0.0/maptiler-sdk.umd.min.js"></script>
<link href="https://cdn.maptiler.com/maptiler-sdk-js/v3.0.0/maptiler-sdk.css" rel="stylesheet" />
</head>
<body>
<div id="load-status">Lade React/Babel…</div>
<div id="root"></div>

<script>
  // Storage backed by IndexedDB (much higher quota than localStorage — often
  // 50MB+ vs. ~5-10MB shared across the whole origin). Falls back to
  // localStorage automatically if IndexedDB is unavailable for any reason.
  // Note: this does NOT protect against iOS resetting the whole storage
  // container when a Home Screen icon is removed and re-added — that's a
  // platform-level behaviour, not something any web storage API can prevent.
  // Use the app's iCloud backup feature after importing data as the real
  // safety net against that.
  (function () {
    const DB_NAME = "flugbuch-db";
    const STORE = "kv";
    let dbPromise = null;

    function openDb() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        if (!window.indexedDB) { reject(new Error("IndexedDB not available")); return; }
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => { req.result.createObjectStore(STORE); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbPromise;
    }

    async function idbGet(key) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, "readonly");
        const req = tx.objectStore(STORE).get(key);
        req.onsuccess = () => resolve(req.result !== undefined ? req.result : null);
        req.onerror = () => reject(req.error);
      });
    }
    async function idbSet(key, value) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).put(value, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    async function idbDelete(key) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    async function idbKeys() {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, "readonly");
        const req = tx.objectStore(STORE).getAllKeys();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    const PREFIX = "flugbuch:";
    function keyFor(key) { return PREFIX + key; }

    // One-time migration: if there's data in localStorage from before this
    // upgrade, copy it into IndexedDB so nothing already saved is lost.
    let migrated = false;
    async function migrateFromLocalStorageOnce() {
      if (migrated) return;
      migrated = true;
      try {
        const existingKeys = new Set(await idbKeys());
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(PREFIX) && !existingKeys.has(k)) {
            await idbSet(k, localStorage.getItem(k));
          }
        }
      } catch (e) { console.error("Migration to IndexedDB failed:", e); }
    }

    window.storage = {
      async get(key) {
        try {
          await migrateFromLocalStorageOnce();
          const raw = await idbGet(keyFor(key));
          if (raw !== null) return { key, value: raw };
          // Fallback read in case IndexedDB is empty but localStorage has it
          const lsRaw = localStorage.getItem(keyFor(key));
          return lsRaw !== null ? { key, value: lsRaw } : null;
        } catch (e) {
          console.error("storage.get error, falling back to localStorage:", e);
          try {
            const raw = localStorage.getItem(keyFor(key));
            return raw !== null ? { key, value: raw } : null;
          } catch { return null; }
        }
      },
      async set(key, value) {
        try {
          await migrateFromLocalStorageOnce();
          await idbSet(keyFor(key), value);
          return { key, value };
        } catch (e) {
          console.error("storage.set error, falling back to localStorage:", e);
          try { localStorage.setItem(keyFor(key), value); return { key, value }; }
          catch (e2) { console.error("localStorage fallback also failed:", e2); return null; }
        }
      },
      async delete(key) {
        try {
          await migrateFromLocalStorageOnce();
          const existedIdb = (await idbGet(keyFor(key))) !== null;
          await idbDelete(keyFor(key));
          try { localStorage.removeItem(keyFor(key)); } catch {}
          return { key, deleted: existedIdb };
        } catch (e) {
          console.error("storage.delete error, falling back to localStorage:", e);
          try {
            const k = keyFor(key);
            const existed = localStorage.getItem(k) !== null;
            localStorage.removeItem(k);
            return { key, deleted: existed };
          } catch { return null; }
        }
      },
      async list(prefix) {
        try {
          await migrateFromLocalStorageOnce();
          const fullPrefix = PREFIX + (prefix || "");
          const allKeys = await idbKeys();
          const keys = allKeys.filter(k => typeof k === "string" && k.startsWith(fullPrefix)).map(k => k.slice(PREFIX.length));
          return { keys, prefix };
        } catch (e) {
          console.error("storage.list error, falling back to localStorage:", e);
          try {
            const fullPrefix = PREFIX + (prefix || "");
            const keys = [];
            for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              if (k && k.startsWith(fullPrefix)) keys.push(k.slice(PREFIX.length));
            }
            return { keys, prefix };
          } catch { return null; }
        }
      },
    };
  })();

  window.addEventListener("error", function (e) {
    const el = document.getElementById("load-status");
    el.style.display = "block";
    el.style.color = "#f87171";
    el.textContent = "JS-FEHLER: " + (e.error ? (e.error.stack || e.error.message) : e.message) + " (Zeile " + e.lineno + ")";
  });
  window.addEventListener("unhandledrejection", function (e) {
    const msg = "PROMISE-FEHLER: " + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
    // MapTiler's own WebGL-context-loss handling triggers an internal
    // promise rejection (via setPrimaryLanguage) that looks fatal but
    // isn't — the app already listens for and recovers from context loss
    // itself (rebuilding the map). Surfacing this as a stuck red banner
    // was misleading once the map had already silently recovered.
    if (/maptiler-sdk|setPrimaryLanguage/.test(msg)) { console.error(msg); return; }
    const el = document.getElementById("load-status");
    el.style.display = "block";
    el.style.color = "#f87171";
    el.textContent = msg;
  });

  async function checkAndRender() {
    const status = document.getElementById("load-status");
    if (typeof React === "undefined") { status.textContent = "FEHLER: React konnte nicht geladen werden (CDN blockiert?)"; status.style.color="#f87171"; return; }
    if (typeof ReactDOM === "undefined") { status.textContent = "FEHLER: ReactDOM konnte nicht geladen werden (CDN blockiert?)"; status.style.color="#f87171"; return; }
    if (typeof Babel === "undefined") { status.textContent = "FEHLER: Babel konnte nicht geladen werden (CDN blockiert?)"; status.style.color="#f87171"; return; }
    status.textContent = "React/Babel geladen ✓ — lade App-Code…";

    let appSource;
    try {
      const resp = await fetch("flugbuch.jsx");
      if (!resp.ok) { status.textContent = "FEHLER beim Laden von flugbuch.jsx: HTTP " + resp.status; status.style.color = "#f87171"; return; }
      appSource = await resp.text();
      status.textContent = "App-Code geladen ✓ (" + appSource.length + " Zeichen) — kompiliere…";
    } catch (e) {
      status.style.color = "#f87171";
      status.textContent = "FEHLER beim Laden von flugbuch.jsx:\n" + (e.message || String(e));
      return;
    }

    let compiled;
    try {
      compiled = Babel.transform(appSource, { presets: ["react"] }).code;
      status.textContent = "Kompiliert ✓ — starte App…";
    } catch (e) {
      status.style.color = "#f87171";
      status.textContent = "BABEL-KOMPILIER-FEHLER:\n" + (e.message || String(e));
      return;
    }
    try {
      const runApp = new Function("React", "ReactDOM", compiled + "\n; return FlugbuchApp;");
      const FlugbuchApp = runApp(React, ReactDOM);
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(React.createElement(FlugbuchApp));
      setTimeout(function() {
        if (!status.textContent.includes("FEHLER")) status.style.display = "none";
      }, 800);
    } catch (e) {
      status.style.color = "#f87171";
      status.textContent = "RENDER-FEHLER:\n" + (e.message || String(e)) + "\n\n" + (e.stack || "");
    }
  }

  window.addEventListener("load", function() {
    setTimeout(checkAndRender, 300);
  });
</script>


<script>
  // Service Worker: ermöglicht Offline-Nutzung ab dem zweiten Online-Start.
  // Siehe sw.js für die Cache-Strategie (network-first, cache-fallback).
  window.addEventListener("load", function() {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(function(e) {
        console.error("Service-Worker-Registrierung fehlgeschlagen:", e);
      });
    }
  });
</script>

<div id="offline-banner" style="display:none;position:fixed;bottom:calc(10px + env(safe-area-inset-bottom, 0px));left:10px;right:10px;background:rgba(245,158,11,0.8);color:#1a1200;font-weight:700;text-align:center;padding:7px 16px;border-radius:10px;z-index:9999;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;">
  📴 Offline — zuletzt gespeicherter Stand
</div>
<script>
  function updateOfflineBanner() {
    var el = document.getElementById("offline-banner");
    if (el) el.style.display = navigator.onLine ? "none" : "block";
  }
  window.addEventListener("online", updateOfflineBanner);
  window.addEventListener("offline", updateOfflineBanner);
  updateOfflineBanner();
</script>
</body>
</html>

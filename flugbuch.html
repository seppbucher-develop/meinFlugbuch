<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Flugbuch</title>

<meta name="theme-color" content="#ffffff" />

<link rel="icon" href="favicon.ico?v=2" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png?v=2" />
<link rel="icon" type="image/png" sizes="96x96" href="icons/icon-96.png?v=2" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2" />
<link rel="manifest" href="manifest.json?v=2" />

<style>
  html, body { margin:0; padding:0; background:#040e20; -webkit-tap-highlight-color: transparent; }
  #root { min-height: 100vh; }
  #load-status { color:#fcd34d; font-family:monospace; font-size:11px; padding:14px; white-space:pre-wrap; }
  /* MapTiler/MapLibre marker popup text was rendering low-contrast (light
     grey on white) — make it clearly legible. */
  .maplibregl-popup-content { color:#111827; font-weight:600; }
</style>

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<!-- Latitude/longitude -> IANA timezone lookup, used to convert IGC B-record
     times (always UTC per the IGC spec) to correct local time when the file
     doesn't carry its own HFTZN timezone header. Exposes a global
     `tzlookup(lat, lon)` function. -->
<script src="https://cdn.jsdelivr.net/npm/tz-lookup@6.1.25/tz.js"></script>
<script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.0.0/maptiler-sdk.umd.min.js"></script>
<link href="https://cdn.maptiler.com/maptiler-sdk-js/v3.0.0/maptiler-sdk.css" rel="stylesheet" />
<!-- MP4-Muxer für das Flug-Video (Aufnahme mit festen 30 fps per WebCodecs); fehlt er, nimmt die App in Echtzeit auf. -->
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
</head>
<body>
<div id="load-status">Lade App…</div>
<div id="root"></div>

<script src="storage.js"></script>
<script src="loader.js" data-app="FlugbuchApp" data-src="flugbuch"></script>


<script>
  // Service Worker: ermöglicht Offline-Nutzung ab dem zweiten Online-Start.
  // Siehe sw.js für die Cache-Strategie (network-first, cache-fallback).
  window.addEventListener("load", function() {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(function(e) {
        console.error("Service-Worker-Registrierung fehlgeschlagen:", e);
      });
    }
  });
</script>

<div id="offline-banner" style="display:none;position:fixed;bottom:calc(10px + env(safe-area-inset-bottom, 0px));left:10px;right:10px;background:rgba(245,158,11,0.8);color:#1a1200;font-weight:700;text-align:center;padding:7px 16px;border-radius:10px;z-index:9999;font-family:system-ui,sans-serif;font-size:14px;">
  📴 Offline — zuletzt gespeicherter Stand
</div>
<script>
  function updateOfflineBanner() {
    var el = document.getElementById("offline-banner");
    if (el) el.style.display = navigator.onLine ? "none" : "block";
  }
  window.addEventListener("online", updateOfflineBanner);
  window.addEventListener("offline", updateOfflineBanner);
  updateOfflineBanner();
</script>
<script src="chrome.js" data-page="flugbuch"></script>
</body>
</html>
